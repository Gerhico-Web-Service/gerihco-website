<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerihco | Coming Soon</title>
  <meta name="description" content="Gerihco is coming soon. Our website will launch with services, industries, and consulting insights for institutional clients." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #042C53;
      --navy-2: #0a3d66;
      --ink: #0F1720;
      --muted: #5d6774;
      --line: rgba(13, 36, 63, 0.12);
      --panel: rgba(255,255,255,0.9);
      --bg: #eef2f6;
      --blue: #2aa7f7;
      --blue-deep: #185fa5;
      --white: #ffffff;
      --shadow: rgba(4, 44, 83, 0.12);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: "Inter", Arial, sans-serif;
      background: linear-gradient(180deg, #f5f7fa 0%, var(--bg) 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 18px;
    }

    .page {
      width: min(960px, 100%);
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 24px;
      box-shadow: 0 24px 64px var(--shadow);
      padding: 40px 28px 32px;
      text-align: center;
    }

    .brand {
      width: 120px;
      height: 120px;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(42,167,247,0.12), rgba(4,44,83,0.04));
      border: 1px solid rgba(42,167,247,0.15);
      position: relative;
    }

    .brand::before,
    .brand::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 999px;
    }

    .brand::before {
      width: 58px;
      height: 58px;
      top: 24px;
      border: 5px solid var(--navy);
      border-top-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      transform: translateX(-50%) rotate(-45deg);
    }

    .brand::after {
      width: 18px;
      height: 20px;
      bottom: 22px;
      background: var(--navy);
      border-radius: 4px 4px 0 0;
      box-shadow: 0 -8px 0 0 var(--navy);
    }

    h1 {
      margin: 0;
      font-size: clamp(2.4rem, 5vw, 4rem);
      line-height: 1.05;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--navy);
    }

    .eyebrow {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 16px;
      border-radius: 999px;
      background: rgba(42,167,247,0.08);
      border: 1px solid rgba(42,167,247,0.2);
      color: var(--blue-deep);
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      font-weight: 700;
    }

    .tagline {
      max-width: 640px;
      margin: 20px auto 0;
      color: var(--muted);
      font-size: 1.08rem;
      line-height: 1.8;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin: 28px auto 0;
      max-width: 760px;
    }

    .detail {
      background: #f8fafc;
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 18px 16px;
      text-align: left;
    }

    .label {
      display: block;
      margin-bottom: 8px;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--blue-deep);
      font-weight: 700;
    }

    .value {
      color: var(--ink);
      font-size: 1.06rem;
      line-height: 1.5;
    }

    .value a {
      color: var(--navy-2);
      text-decoration: none;
    }

    .value a:hover {
      text-decoration: underline;
    }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin: 30px auto 0;
      max-width: 560px;
    }

    input[type="email"] {
      flex: 1 1 260px;
      min-width: 220px;
      padding: 16px 18px;
      border-radius: 999px;
      border: 1px solid var(--line);
      font: inherit;
      background: white;
      color: var(--ink);
      outline: none;
    }

    input[type="email"]:focus {
      border-color: rgba(42,167,247,0.7);
      box-shadow: 0 0 0 3px rgba(42,167,247,0.12);
    }

    button {
      border: none;
      border-radius: 999px;
      background: var(--navy);
      color: white;
      padding: 16px 24px;
      font: inherit;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.18s ease;
    }

    button:hover {
      background: var(--navy-2);
    }
  </style>
</head>
<body>
  <main class="page">
    <div class="brand" aria-hidden="true"></div>
    <h1>Gerihco</h1>
    <div class="eyebrow">Coming soon</div>
    <p class="tagline">
      Gerihco helps government, financial services, and manufacturing organizations turn complex challenges
      into measurable operational and strategic results.
    </p>

    <div class="details">
      <div class="detail">
        <span class="label">Launch date</span>
        <div class="value">TBD</div>
      </div>
      <div class="detail">
        <span class="label">Contact</span>
        <div class="value"><a href="mailto:hello@gerihco.com">hello@gerihco.com</a></div>
      </div>
    </div>

    <form action="mailto:hello@gerihco.com" method="post" enctype="text/plain">
      <input type="email" name="email" aria-label="Email address" placeholder="Enter your email" required />
      <button type="submit">Join newsletter</button>
    </form>
  </main>
</body>
</html>
