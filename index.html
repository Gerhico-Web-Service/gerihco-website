<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerihco | Coming Soon</title>
  <meta name="description" content="Gerihco is coming soon. Our website will launch with services, industries, and consulting insights for institutional clients." />
  <style>
    :root {
      --ink: #0a0c0f;
      --paper: #ffffff;
      --paper-muted: #f4f5f6;
      --blue: #2aa7f7;
      --blue-deep: #185fa5;
      --gray-text: #5f5e5a;
      --border: #e3e4e6;
      --shadow: rgba(10, 12, 15, 0.08);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f7f8f9 0%, #eef3f7 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 32px 16px;
    }

    .card {
      width: min(860px, 100%);
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 18px 45px var(--shadow);
      padding: 48px 32px;
    }

    .brand-mark {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      display: block;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(42,167,247,0.12), rgba(24,95,165,0.04));
      position: relative;
    }

    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 999px;
    }

    .brand-mark::before {
      width: 54px;
      height: 54px;
      top: 20px;
      border: 4px solid var(--blue);
      border-top-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      transform: translateX(-50%) rotate(-45deg);
    }

    .brand-mark::after {
      width: 16px;
      height: 18px;
      bottom: 18px;
      background: #111;
      border-radius: 4px 4px 0 0;
      box-shadow: 0 -8px 0 0 #111;
    }

    h1 {
      margin: 0 0 12px;
      text-align: center;
      font-size: clamp(2.2rem, 4vw, 3.4rem);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .tagline {
      text-align: center;
      font-size: 1.08rem;
      color: var(--gray-text);
      max-width: 620px;
      margin: 0 auto 28px;
      line-height: 1.7;
    }

    .meta {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 18px;
      margin: 24px 0 30px;
    }

    .info {
      background: var(--paper-muted);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px 18px;
    }

    .label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      color: var(--blue-deep);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .value {
      font-size: 1.02rem;
      color: var(--ink);
      line-height: 1.5;
    }

    a {
      color: var(--blue-deep);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    form {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
      margin-top: 18px;
    }

    input[type="email"] {
      flex: 1 1 280px;
      min-width: 220px;
      padding: 15px 16px;
      border-radius: 999px;
      border: 1px solid var(--border);
      font-size: 1rem;
      background: #fff;
      color: var(--ink);
    }

    button {
      border: none;
      border-radius: 999px;
      background: var(--blue-deep);
      color: #fff;
      padding: 15px 22px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      cursor: pointer;
    }

    button:hover {
      background: var(--blue);
    }

    .status {
      display: inline-block;
      margin-top: 18px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--paper-muted);
      border: 1px solid var(--border);
      color: var(--blue-deep);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
      display: block;
      width: fit-content;
      margin-inline: auto;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-mark" aria-hidden="true"></div>
    <h1>Gerihco</h1>
    <p class="tagline">
      Gerihco helps government, financial services, and manufacturing organizations turn complex challenges into measurable operational results.
    </p>

    <div class="meta">
      <div class="info">
        <span class="label">Launch date</span>
        <div class="value">TBD</div>
      </div>
      <div class="info">
        <span class="label">Contact</span>
        <div class="value"><a href="mailto:hello@gerihco.com">hello@gerihco.com</a></div>
      </div>
    </div>

    <div class="status">Coming Soon</div>

    <form action="mailto:hello@gerihco.com" method="post" enctype="text/plain">
      <input type="email" name="email" placeholder="Enter your email" aria-label="Email address" required />
      <button type="submit">Join newsletter</button>
    </form>
  </main>
</body>
</html>
