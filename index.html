<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gerihco | Under Construction</title>
  <meta name="description" content="Gerihco website is currently under construction." />
  <style>
    :root {
      --ink: #0a0c0f;
      --paper: #ffffff;
      --paper-muted: #f4f5f6;
      --blue: #2aa7f7;
      --blue-deep: #185fa5;
      --gray-text: #5f5e5a;
      --border: #e3e4e6;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(180deg, #f7f8f9 0%, #eef3f7 100%);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      width: min(760px, calc(100% - 32px));
      background: rgba(255,255,255,0.92);
      border: 1px solid var(--border);
      border-radius: 16px;
      box-shadow: 0 18px 45px rgba(10, 12, 15, 0.08);
      padding: 48px 32px;
      text-align: center;
    }
    .brand-mark {
      width: 96px;
      height: 96px;
      margin: 0 auto 18px;
      display: block;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(42,167,247,0.12), rgba(24,95,165,0.04));
      position: relative;
    }
    .brand-mark::before,
    .brand-mark::after {
      content: "";
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      border-radius: 999px;
    }
    .brand-mark::before {
      width: 54px;
      height: 54px;
      top: 20px;
      border: 4px solid var(--blue);
      border-top-color: transparent;
      border-right-color: transparent;
      border-radius: 50%;
      transform: translateX(-50%) rotate(-45deg);
    }
    .brand-mark::after {
      width: 16px;
      height: 18px;
      bottom: 18px;
      background: #111;
      border-radius: 4px 4px 0 0;
      box-shadow: 0 -8px 0 0 #111;
    }
    h1 {
      font-size: clamp(2rem, 4vw, 3.2rem);
      margin: 0 0 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    p {
      font-size: 1.06rem;
      color: var(--gray-text);
      line-height: 1.7;
      margin: 0 auto;
      max-width: 560px;
    }
    .status {
      display: inline-block;
      margin-top: 22px;
      padding: 10px 18px;
      border-radius: 999px;
      background: var(--paper-muted);
      border: 1px solid var(--border);
      color: var(--blue-deep);
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      font-size: 0.78rem;
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="brand-mark" aria-hidden="true"></div>
    <h1>Gerihco</h1>
    <p>
      Our website is currently under construction. We're preparing new information
      about our services, industries, and consulting capabilities.
    </p>
    <div class="status">Under Construction</div>
  </main>
</body>
</html>
